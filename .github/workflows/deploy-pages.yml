name: Publish Noor prototype to GitHub Pages

# Pages runs in "GitHub Actions" source mode (switched 14 Jun 2026 by deploy.yml
# on main), and the github-pages environment only allows deploys from main —
# so this workflow (on a claude/* branch) cannot run deploy-pages itself
# (rejected by environment protection). Instead it:
#   1. assembles the composite site:
#        /            noor prototype (this branch, noor-prototype/)
#        /mal/        mal.ai-branded twin (vendored in noor-prototype/mal/)
#        /tradepay/   Tradepay — live from main:tradepay (canonical)
#        /aristotle/  Digital Aristotle — live from main root
#   2. force-pushes it to the gh-pages branch (mirror + deploy source)
#   3. dispatches "Deploy to GitHub Pages" (deploy-pages.yml on main), which
#      runs on ref main (environment-allowed), checks out gh-pages, deploys.
#      workflow_dispatch is exempt from GITHUB_TOKEN recursion prevention.
# NOTE: deploy.yml on main still deploys main's root over the whole site on
# every push to main — remove/adjust it on main to keep the composite layout.

on:
  push:
    branches:
      - claude/busy-franklin-nzj9eu
    paths:
      - 'noor-prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Checkout main (aristotle + tradepay)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Assemble composite site (noor retired — Mal only)
        run: |
          mkdir -p _site
          cp -r noor-prototype/mal _site/mal
          cp -r _main/tradepay _site/tradepay
          mkdir -p _site/aristotle
          cp -r _main/. _site/aristotle/
          rm -rf _site/aristotle/.git _site/aristotle/.github
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mal — clickable prototype</title>
          <script>location.replace('./mal/' + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=./mal/">
          <style>body{font-family:system-ui;background:#f7f7f9;color:#0e0e10;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
          </head><body><p>Redirecting to the <a href="./mal/">Mal prototype</a>…</p></body></html>
          HTML
          cp _site/index.html _site/404.html

      - name: Push composite to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish composite site (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages

      - name: Dispatch Pages deploy from main
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
