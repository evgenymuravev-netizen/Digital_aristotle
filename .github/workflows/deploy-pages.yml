name: Publish prototypes to GitHub Pages

# The Pages site deploys in "GitHub Actions" mode. main/deploy.yml publishes
# main's root on every push to main — which silently drops /mal/ (that is what
# happened on 14 Aug 2026). This workflow publishes the *composite* site:
#   /            main's root, verbatim (Digital Aristotle / MMAT — untouched)
#   /mal/        the Mal clickable prototype (vendored in noor-prototype/mal/)
#   /noor/       the Noor Finance prototype (vendored in noor-prototype/noorfinance/)
#   /aristotle/  redirect to / (kept alive for older links)
# It force-pushes the assembly to gh-pages, then dispatches deploy-pages.yml on
# main, which deploys gh-pages from an environment-allowed ref.
#
# NOTE: a later push to main re-runs main/deploy.yml and republishes main's root
# alone, removing /mal/ again. Re-run this workflow (Actions → Run workflow) or
# move mal/ into main to make it permanent.

on:
  push:
    branches:
      - claude/busy-franklin-nzj9eu
    paths:
      - 'noor-prototype/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Checkout main (the live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Assemble composite site
        run: |
          mkdir -p _site
          # 1. main's root exactly as it is today — the live landing page stays put
          cp -r _main/. _site/
          rm -rf _site/.git _site/.github
          # 2. the prototypes alongside it
          cp -r noor-prototype/mal _site/mal
          cp -r noor-prototype/noorfinance _site/noor
          # 3. keep the older /aristotle/ link working
          mkdir -p _site/aristotle
          cat > _site/aristotle/index.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <title>Digital Aristotle</title>
          <script>location.replace('../');</script>
          <meta http-equiv="refresh" content="0; url=../">
          </head><body><p>Moved to <a href="../">the main site</a>.</p></body></html>
          HTML
          touch _site/.nojekyll
          echo "--- assembled:"; ls _site

      - name: Push composite to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish composite site (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages

      - name: Dispatch Pages deploy from main
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
